<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pôle Animation – School RP</title>

<!-- =====================================================================
     STYLE  (les couleurs se changent juste en dessous, dans :root)
     ===================================================================== -->
<style>
  :root {
    --bg: #0f1220;        /* fond de la page */
    --panel: #181c30;     /* fond des cartes */
    --panel2: #20253d;    /* fond des champs */
    --text: #e8eaf6;
    --muted: #9aa0c0;
    --accent: #7c5cff;    /* couleur principale (boutons, onglet actif) */
    --ok: #22c55e;
    --bad: #ef4444;
    --warn: #f59e0b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 880px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 22px 0 10px; }
  h2.day { color: var(--accent); font-size: 1rem; margin: 20px 0 8px; text-transform: none; }
  h3 { margin: 0; font-size: 1.05rem; }
  p { margin: 8px 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .center { text-align: center; }
  .empty { color: var(--muted); padding: 14px; text-align: center; background: var(--panel); border-radius: var(--radius); }

  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .me { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; border-bottom: 1px solid var(--panel2); }
  .tab { background: transparent; color: var(--muted); border: 0; padding: 9px 13px; border-radius: 10px;
         cursor: pointer; white-space: nowrap; font-size: .95rem; }
  .tab.on { background: var(--accent); color: #fff; }
  .dot { background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 7px; font-size: .75rem; margin-left: 4px; }

  .card { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 10px; }
  .card.done { opacity: .6; }
  .card.st-pending { border-left: 4px solid var(--warn); }
  .card.st-refused { border-left: 4px solid var(--bad); }
  .card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .row { margin: 6px 0; font-size: .93rem; }
  .warn { color: var(--warn); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .chip { display: inline-block; font-size: .75rem; padding: 2px 9px; border-radius: 99px; white-space: nowrap;
          color: var(--c, #fff); border: 1px solid var(--c, #fff); background: color-mix(in srgb, var(--c, #fff) 14%, transparent); }
  .admin { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 6px; margin-left: 4px;
           background: #facc15; color: #3b2f00; font-weight: 700; white-space: nowrap; }

  .btn { border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: .9rem; color: #fff; background: var(--panel2); }
  .btn.primary { background: var(--accent); }
  .btn.ok { background: var(--ok); color: #05260f; font-weight: 600; }
  .btn.bad { background: var(--bad); }
  .btn.ghost { background: transparent; border: 1px solid var(--panel2); color: var(--muted); }
  .btn:hover { filter: brightness(1.15); }

  label { display: block; margin: 10px 0; font-size: .9rem; color: var(--muted); }
  input, textarea, select { width: 100%; margin-top: 4px; padding: 10px; border-radius: 10px; border: 1px solid var(--panel2);
          background: var(--panel2); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; margin: 0; }
  .check input { width: auto; margin: 0; }
  .filter { margin-bottom: 10px; max-width: 280px; }
  code { background: var(--panel2); padding: 2px 8px; border-radius: 6px; font-size: .95rem; letter-spacing: .5px; }
  .pwrow { display: flex; gap: 8px; align-items: center; }
  .pwrow input { flex: 1; min-width: 0; margin-top: 0; }
  .lbl { display: block; margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .staffchip { font-size: .85rem; padding: 3px 6px 3px 10px; }
  .staffchip .x { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 3px; font-size: .85rem; }
  .banner { padding: 10px 14px; border-radius: var(--radius); margin: 12px 0 0; border: 1px solid var(--warn);
            background: color-mix(in srgb, var(--warn) 16%, transparent); font-size: .93rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
  .stat { background: var(--panel); border-radius: var(--radius); padding: 12px 14px; }
  .stat b { display: block; font-size: 1.45rem; }
  .stat span { color: var(--muted); font-size: .85rem; }
  .bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  textarea.ann { min-height: 150px; font-size: .9rem; }

  .auth { max-width: 380px; margin: 60px auto; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 4px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--panel2); }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  td.num, th.num { text-align: center; }
  tr:last-child td { border-bottom: 0; }

  .member { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .member.pending { border-left: 4px solid var(--warn); }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls select { width: auto; margin: 0; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px); background: var(--ok); color: #05260f;
           padding: 10px 18px; border-radius: 12px; opacity: 0; transition: .25s; max-width: 90vw; font-weight: 600; z-index: 10; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.bad { background: var(--bad); color: #fff; }
</style>
</head>

<body>
<div id="app"><p class="center muted">Chargement…</p></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   1. CONFIGURATION  ← c'est ici que tu changes les réglages
   ===================================================================== */

// Les 2 valeurs à copier depuis Supabase > Project Settings > API
const SUPABASE_URL = "https://jjkgwmljitplywxpgoxw.supabase.co";
const SUPABASE_KEY = "sb_publishable_lhmwV4Yk2MqSz2gTNawyZQ_f1_-aYEm";

// Les comptes sont créés avec "pseudo@ce-domaine" (aucun mail n'est envoyé).
// Si Supabase refuse l'adresse ("invalid email"), mets ici un autre nom de domaine.
const EMAIL_DOMAIN = "animation-rp.com";

// Un event est considéré "fait" une fois ce nombre de minutes écoulé après son début
const DUREE_EVENT_MIN = 60;

// Les alertes de quota (bandeau pour l'animateur, pastille pour les responsables)
// n'apparaissent qu'à partir de ce jour de la semaine : 1 = lundi … 4 = jeudi … 7 = dimanche
const ALERT_FROM_DAY = 4;

// Les grades. La clé (gerant, responsable...) doit rester identique à setup.sql.
// level = niveau d'autorité (4 = le plus haut). Tu peux changer label et color.
const GRADES = {
  gerant:           { label: "Gérant animation", level: 4, color: "#ef4444" },
  responsable:      { label: "Responsable",      level: 3, color: "#f59e0b" },
  animateur_senior: { label: "Animateur senior", level: 2, color: "#3b82f6" },
  animateur:        { label: "Animateur",        level: 1, color: "#22c55e" },
  invite:           { label: "Invité",           level: 0, color: "#9aa0c0" },  // lecture seule
};

// Qui a le droit de faire quoi (basé sur le level ci-dessus).
// ⚠ La vraie sécurité est dans setup.sql ; ici ça ne gère que ce qu'on affiche.
const level          = p => (p && GRADES[p.grade] ? GRADES[p.grade].level : 0);
const isManager      = p => level(p) >= 3;   // responsable + gérant : acceptent les demandes, fournissent les gears
const canOpenServer  = p => level(p) >= 2;   // animateur senior et plus : ouvrent les serveurs privés
const isGerant       = p => level(p) === 4;  // gérant : gère l'équipe
const isGuest        = p => !!p && p.grade === "invite";   // invité : peut seulement regarder

// Les onglets du site (change l'ordre ou les noms ici)
const TABS = [
  { id: "planning", label: "📅 Planning" },
  { id: "week",     label: "🗓 Semaine" },
  { id: "requests", label: "📝 Demandes",  noGuest: true },       // noGuest : caché pour les invités
  { id: "announces", label: "📢 Annonces", noGuest: true },
  { id: "history",  label: "✅ Historique" },
  { id: "stats",    label: "📊 Stats" },
  { id: "quotas",   label: "🔔 Quotas",    managerOnly: true },   // managerOnly : responsables et gérants
  { id: "team",     label: "👥 Équipe" },
  { id: "profile",  label: "👤 Mon profil", noGuest: true },
];

// Le modèle des annonces (texte à copier-coller, ex. sur Discord).
// Modifie les lignes ci-dessous pour changer la forme : **gras**, emojis, ordre...
function buildAnnouncement(ev) {
  return [
    `🎉 **${ev.title}** 🎉`,
    ``,
    `📅 **Date :** ${cap(fmtDay(ev.event_date))}`,
    `🕒 **Heure :** ${fmtTime(ev.event_date)}`,
    `🔑 **Mot de passe :** ${state.passwords[ev.id] || "à définir"}`,
    ``,
    `📝 **Description :** ${ev.description || "à définir"}`,
    `🏆 **Récompense :** ${ev.reward || "à définir"}`,
  ].join("\n");
}


/* =====================================================================
   2. OUTILS
   ===================================================================== */

let db; // le client Supabase
const state = {
  session: null,       // connexion en cours
  me: null,            // mon profil
  profiles: {},        // tous les profils, par id
  events: [],          // tous les events
  passwords: {},       // mots de passe des serveurs (la base ne les donne pas aux invités)
  quota: 2,            // quota hebdomadaire par défaut (modifiable par le gérant)
  profileId: null,     // profil affiché (null = le mien)
  tab: "planning",     // onglet affiché
  weekOffset: 0,       // 0 = cette semaine, -1 = la précédente...
  authMode: "login",   // "login" ou "signup"
  histFilter: "",      // filtre de l'historique
};

// Empêche l'injection de HTML dans les textes écrits par les utilisateurs
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const cap     = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay  = d => new Date(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const fmtTime = d => new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const byDate  = (a, b) => new Date(a.event_date) - new Date(b.event_date);

const startMs = ev => new Date(ev.event_date).getTime();
const isDone  = ev => Date.now() > startMs(ev) + DUREE_EVENT_MIN * 60000;

// Lundi 00:00 de la semaine qui contient la date d
function startOfWeek(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}

function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = ""), 3500);
}

const empty = msg => `<p class="empty">${msg}</p>`;

// Copie un texte dans le presse-papier (okMsg = message affiché quand c'est fait)
async function copyText(text, okMsg) {
  const msg = okMsg || "Mot de passe copié 📋";
  if (!text) return toast("Rien à copier.", true);
  try {
    await navigator.clipboard.writeText(text);
    return toast(msg);
  } catch (e) { /* on essaie la méthode de secours juste en dessous */ }
  const t = document.createElement("textarea");
  t.value = text;
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  toast(ok ? msg : "Impossible de copier : sélectionne le texte à la main.", !ok);
}

// "Staff présent" d'un event : comptes du site + noms ajoutés à la main
function staffLine(ev) {
  const all = (ev.staff_ids || []).map(who).concat((ev.staff_names || []).map(n => `<strong>${esc(n)}</strong>`));
  return all.length ? `<div class="row">👥 Staff présent : ${all.join(", ")}</div>` : "";
}

// Liste déroulante des comptes du site + champ pour des noms manuels (formulaire de demande)
// Chaque membre choisi devient une pastille (avec ✕ pour le retirer) qui contient un champ caché "staff".
function staffPicker() {
  const accounts = Object.values(state.profiles).filter(p => p.approved && !isGuest(p));
  return `<span class="lbl">Staff présent</span>
    <select data-act="addStaff">
      <option value="">➕ Ajouter un membre du site…</option>
      ${accounts.map(p => `<option value="${p.id}">${esc(p.username)} · ${GRADES[p.grade] ? GRADES[p.grade].label : ""}</option>`).join("")}
    </select>
    <div id="staffChips" class="chips"></div>
    <label>Autres noms (pas de compte sur le site, séparés par une virgule)
      <input name="staff_names" maxlength="200" placeholder="Ex : Léo, Marie"></label>`;
}


// Petits morceaux d'affichage réutilisés partout
const adminBadge = p => (p && p.is_admin ? ` <span class="admin">🛡 Admin serveur</span>` : "");
const gradeChip  = g => (GRADES[g] ? `<span class="chip" style="--c:${GRADES[g].color}">${GRADES[g].label}</span>` : "");
function who(id) {                       // "Pseudo 🛡" d'après un id
  const p = state.profiles[id];
  return p ? `<strong>${esc(p.username)}</strong>${adminBadge(p)}` : `<span class="muted">inconnu</span>`;
}


/* =====================================================================
   3. CHARGEMENT DES DONNÉES
   ===================================================================== */

async function loadAll() {
  const uid = state.session.user.id;

  const { data: me, error: e1 } = await db.from("profiles").select("*").eq("id", uid).single();
  if (e1 || !me) throw new Error("Profil introuvable. As-tu bien exécuté setup.sql dans Supabase ?");
  state.me = me;
  if (!me.approved) return;               // compte pas encore validé : on s'arrête là

  const [p, e, pw, st] = await Promise.all([
    db.from("profiles").select("*").order("username"),
    db.from("events").select("*").order("event_date"),
    db.from("event_passwords").select("*"),
    db.from("app_settings").select("*"),
  ]);
  if (p.error) throw p.error;
  if (e.error) throw e.error;
  state.profiles = Object.fromEntries(p.data.map(x => [x.id, x]));
  state.events = e.data;
  // Si setup.sql n'a pas encore été relancé, on continue sans les mots de passe
  if (pw.error) console.warn("Mots de passe indisponibles :", pw.error.message);
  state.passwords = pw.error ? {} : Object.fromEntries(pw.data.map(x => [x.event_id, x.password]));
  const q = (!st.error && st.data && st.data[0]) ? st.data[0].weekly_quota : undefined;
  state.quota = typeof q === "number" ? q : 2;    // 2 par défaut si setup.sql n'a pas été relancé
}

async function refresh() {
  try { await loadAll(); } catch (err) { toast(err.message, true); }
  render();
}


/* =====================================================================
   4. AFFICHAGE D'UN EVENT (la "carte")
   ===================================================================== */

function eventCard(ev, grouped) {
  const me = state.me;
  const done = ev.status === "accepted" && isDone(ev);
  const owner = state.profiles[ev.requested_by];
  const mgr = isManager(me);

  let h = `<div class="card ${done ? "done" : ""} st-${ev.status}">`;

  // Titre + date + statut
  const when = grouped ? `🕒 ${fmtTime(ev.event_date)}` : `📅 ${cap(fmtDay(ev.event_date))} à ${fmtTime(ev.event_date)}`;
  const status = ev.status === "pending" ? `<span class="chip" style="--c:#f59e0b">⏳ En attente</span>`
               : ev.status === "refused" ? `<span class="chip" style="--c:#ef4444">❌ Refusée</span>`
               : done ? `<span class="chip" style="--c:#9aa0c0">Terminé</span>` : "";
  h += `<div class="card-head"><div><h3>${esc(ev.title)}</h3><div class="muted">${when}</div></div>${status}</div>`;

  if (ev.description) h += `<p>${esc(ev.description)}</p>`;
  if (ev.reward) h += `<div class="row">🏆 Récompense : ${esc(ev.reward)}</div>`;
  h += `<div class="row">🎭 Animé par ${who(ev.requested_by)} ${owner ? gradeChip(owner.grade) : ""}</div>`;
  if (state.passwords[ev.id] && !done)
    h += `<div class="row">🔑 Mot de passe : <code>${esc(state.passwords[ev.id])}</code> <button class="btn ghost" data-act="copyPw" data-id="${ev.id}">📋 Copier</button></div>`;
  h += staffLine(ev);

  // --- Serveur privé : qui l'ouvre ? (seulement pour les events acceptés)
  if (ev.status === "accepted") {
    h += `<div class="row">🖥 `;
    h += ev.server_opener
      ? `Serveur privé ouvert par ${who(ev.server_opener)}`
      : `<span class="${done ? "muted" : "warn"}">Personne n'a ouvert le serveur privé</span>`;
    h += `</div>`;

    // --- Gears : demandés par l'animateur / fournis par un responsable ou gérant
    const showGears = ev.gear_note || ev.gear_by || (mgr && !done);
    if (showGears) {
      h += `<div class="row">⚙️ `;
      if (ev.gear_note) h += `Gears demandés : <em>${esc(ev.gear_note)}</em>. `;
      h += ev.gear_by ? `Fournis par ${who(ev.gear_by)}` : `<span class="muted">Personne ne fournit de gears pour l'instant</span>`;
      h += `</div>`;
    }

    // --- Boutons (uniquement pour les events pas encore terminés)
    if (!done) {
      let b = "";
      if (!ev.server_opener && canOpenServer(me))
        b += `<button class="btn primary" data-act="takeServer" data-id="${ev.id}">🖥 Je m'occupe d'ouvrir le serveur</button>`;
      if (ev.server_opener && (ev.server_opener === me.id || mgr))
        b += `<button class="btn ghost" data-act="dropServer" data-id="${ev.id}">Libérer le serveur</button>`;
      if (mgr && !ev.gear_by)
        b += `<button class="btn" data-act="takeGears" data-id="${ev.id}">⚙️ Je fournis les gears</button>`;
      if (mgr && ev.gear_by && (ev.gear_by === me.id || isGerant(me)))
        b += `<button class="btn ghost" data-act="dropGears" data-id="${ev.id}">Retirer les gears</button>`;
      if (b) h += `<div class="actions">${b}</div>`;
    }
  }

  // --- Boutons de validation (responsable / gérant) et suppression
  let b2 = "";
  if (ev.status === "pending" && mgr) {
    b2 += `<button class="btn ok" data-act="accept" data-id="${ev.id}">✔ Accepter</button>`;
    b2 += `<button class="btn bad" data-act="refuse" data-id="${ev.id}">✖ Refuser</button>`;
  }
  if (mgr || (ev.requested_by === me.id && ev.status !== "accepted"))
    b2 += `<button class="btn ghost" data-act="delete" data-id="${ev.id}">Supprimer</button>`;
  if (b2) h += `<div class="actions">${b2}</div>`;

  return h + `</div>`;
}

// Affiche une liste d'events avec un titre par jour
function groupByDay(list) {
  let html = "", last = "";
  for (const ev of list) {
    const key = new Date(ev.event_date).toDateString();
    if (key !== last) { html += `<h2 class="day">${cap(fmtDay(ev.event_date))}</h2>`; last = key; }
    html += eventCard(ev, true);
  }
  return html;
}


/* =====================================================================
   5. LES ÉCRANS (un par onglet)
   ===================================================================== */

// ---- Planning : les prochains events acceptés
function viewPlanning() {
  const list = state.events.filter(e => e.status === "accepted" && !isDone(e)).sort(byDate);
  return `<h2>Prochains events</h2>` + (list.length ? groupByDay(list) : empty("Aucun event prévu pour le moment."));
}

// ---- Semaine : la liste des events d'une semaine, jour par jour
function viewWeek() {
  const start = startOfWeek(new Date());
  start.setDate(start.getDate() + 7 * state.weekOffset);
  const end = new Date(start); end.setDate(end.getDate() + 7);
  const last = new Date(end); last.setDate(last.getDate() - 1);

  const list = state.events
    .filter(e => e.status === "accepted" && new Date(e.event_date) >= start && new Date(e.event_date) < end)
    .sort(byDate);

  const short = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  let html = `<div class="weeknav">
      <button class="btn" data-act="weekPrev">← Précédente</button>
      <div class="center"><strong>${short(start)} – ${short(last)}</strong><div class="muted small">${list.length} event(s)${state.weekOffset === 0 ? " · cette semaine" : ""}</div></div>
      <button class="btn" data-act="weekNext">Suivante →</button>
    </div>`;
  if (state.weekOffset !== 0) html += `<p class="center"><button class="btn ghost" data-act="weekToday">Revenir à cette semaine</button></p>`;

  for (let i = 0; i < 7; i++) {
    const day = new Date(start); day.setDate(start.getDate() + i);
    const evs = list.filter(e => new Date(e.event_date).toDateString() === day.toDateString());
    html += `<h2 class="day">${cap(fmtDay(day))}${day.toDateString() === new Date().toDateString() ? " · aujourd'hui" : ""}</h2>`;
    html += evs.length ? evs.map(e => eventCard(e, true)).join("") : `<p class="muted small">Aucun event</p>`;
  }
  return html;
}

// ---- Stats : nombre d'events faits par animateur / animateur senior
// (on compte les events ACCEPTÉS et TERMINÉS dont la personne est l'animateur)
function viewStats() {
  const weekStart = startOfWeek(new Date());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 7);
  const done = state.events.filter(e => e.status === "accepted" && isDone(e));

  const rows = Object.values(state.profiles)
    .filter(p => p.approved && (p.grade === "animateur" || p.grade === "animateur_senior"))
    .map(p => {
      const mine = done.filter(e => e.requested_by === p.id);
      const week = mine.filter(e => new Date(e.event_date) >= weekStart && new Date(e.event_date) < weekEnd).length;
      return { p, week, total: mine.length };
    })
    .sort((a, b) => b.week - a.week || b.total - a.total || a.p.username.localeCompare(b.p.username));

  const sumWeek = rows.reduce((s, r) => s + r.week, 0);

  return `<h2>Stats des animateurs</h2>
    <table>

// ---- Outils : semaines et quotas
function weekRange(offset) {               // [lundi 00:00, lundi suivant 00:00] ; offset -1 = semaine dernière
  const a = startOfWeek(new Date());
  a.setDate(a.getDate() + 7 * (offset || 0));
  const b = new Date(a); b.setDate(b.getDate() + 7);
  return [a, b];
}
const isCounted = p => !!p && p.approved && (p.grade === "animateur" || p.grade === "animateur_senior");
const quotaOf   = p => (p.weekly_quota !== null && p.weekly_quota !== undefined ? p.weekly_quota : state.quota);

// Nombre d'events acceptés d'une personne entre a et b (onlyDone : seulement ceux déjà terminés)
function countFor(uid, a, b, onlyDone) {
  return state.events.filter(e => e.status === "accepted" && e.requested_by === uid
    && new Date(e.event_date) >= a && new Date(e.event_date) < b && (!onlyDone || isDone(e))).length;
}
// Les alertes ne s'affichent qu'à partir du jour réglé par ALERT_FROM_DAY
function alertActive() { return ((new Date().getDay() + 6) % 7) + 1 >= ALERT_FROM_DAY; }

// Où en est la personne cette semaine : "ok" (quota fait), "planned" (assez d'events prévus), "late" (pas assez)
function quotaStatus(p) {
  const [a, b] = weekRange(0), q = quotaOf(p);
  const done = countFor(p.id, a, b, true), total = countFor(p.id, a, b, false);
  return { q, done, total, state: (q === 0 || done >= q) ? "ok" : (total >= q ? "planned" : "late") };
}
function lastWeekResult(p) {               // null si la personne n'était pas encore là la semaine dernière
  const [a, b] = weekRange(-1), q = quotaOf(p);
  if (!p.created_at || new Date(p.created_at) >= b) return null;
  const done = countFor(p.id, a, b, true);
  return { q, done, ok: q === 0 || done >= q };
}
function streak(p) {                       // nombre de semaines d'affilée avec le quota atteint
  const q = quotaOf(p);
  if (!q) return 0;
  let n = 0;
  const [a0, b0] = weekRange(0);
  if (countFor(p.id, a0, b0, true) >= q) n++;
  for (let i = 1; i <= 52; i++) {
    const [a, b] = weekRange(-i);
    if (p.created_at && new Date(p.created_at) >= b) break;
    if (countFor(p.id, a, b, true) >= q) n++; else break;
  }
  return n;
}
const lateList = () => Object.values(state.profiles).filter(isCounted).filter(p => quotaStatus(p).state === "late");

// Bandeau d'alerte pour l'animateur qui est en retard sur son quota
function quotaBanner() {
  const me = state.me;
  if (!isCounted(me) || !alertActive()) return "";
  const s = quotaStatus(me);
  if (s.state !== "late") return "";
  const left = 7 - ((new Date().getDay() + 6) % 7);
  const pend = state.events.filter(e => e.requested_by === me.id && e.status === "pending").length;
  return `<div class="banner">⚠️ <strong>Quota de la semaine :</strong> ${s.done}/${s.q} fait(s), ${s.total - s.done} prévu(s).
    Il te manque ${s.q - s.total} event(s), il reste ${left} jour(s).
    ${pend ? `(${pend} demande(s) en attente, pas encore comptée(s).) ` : ""}<a href="#" data-act="tab" data-id="requests">Faire une demande</a></div>`;
}

// ---- Quotas : suivi de la semaine (responsables et gérants) ; le gérant règle les quotas
function viewQuotas() {
  const g = isGerant(state.me);
  const chip = { ok: ["#22c55e", "✅ Atteint"], planned: ["#3b82f6", "🕒 Prévu"], late: ["#f59e0b", "⚠️ À planifier"] };
  const rows = Object.values(state.profiles).filter(isCounted)
    .map(p => ({ p, s: quotaStatus(p), l: lastWeekResult(p) }))
    .sort((x, y) => ((y.s.state === "late") - (x.s.state === "late")) || x.p.username.localeCompare(y.p.username));
  const day = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"][ALERT_FROM_DAY - 1];

  return `<h2>Quotas hebdomadaires</h2>
    <div class="card">
      <h3>Quota par défaut</h3>
      ${g ? `<div class="pwrow" style="max-width:320px;margin-top:8px"><input type="number" id="globalQuota" min="0" max="14" value="${state.quota}">
            <button class="btn primary" data-act="saveGlobalQuota">Enregistrer</button></div>`
          : `<p><strong>${state.quota}</strong> event(s) par semaine et par animateur.</p>`}
      <p class="muted small">Chaque animateur et animateur senior doit faire ce nombre d'events par semaine (0 = dispensé).
        ${g ? "Tu peux fixer un quota différent pour une personne dans le tableau." : "Seul un gérant peut modifier les quotas."}
        Les alertes apparaissent à partir du ${day}.</p>
    </div>
    <p>⚠️ <strong>${rows.filter(r => r.s.state === "late").length}</strong> à planifier cette semaine ·
       ❌ <strong>${rows.filter(r => r.l && !r.l.ok).length}</strong> quota manqué la semaine dernière</p>
    <table>
      <tr><th>Animateur</th><th class="num">Cette semaine</th><th>État</th><th class="num">Semaine dernière</th><th class="num">Quota</th></tr>
      ${rows.map(({ p, s, l }) => `<tr>
        <td><a href="#" data-act="openProfile" data-id="${p.id}">${esc(p.username)}</a> ${gradeChip(p.grade)}</td>
        <td class="num">${s.done} fait(s)<br><span class="muted small">${s.total - s.done} prévu(s)</span></td>
        <td><span class="chip" style="--c:${chip[s.state][0]}">${chip[s.state][1]}</span></td>
        <td class="num">${l ? `${l.done}/${l.q} ${l.ok ? "✅" : "❌"}` : "—"}</td>
        <td class="num">${g ? `<input type="number" min="0" max="14" style="width:80px;margin:0" data-act="setQuota" data-id="${p.id}"
              value="${p.weekly_quota ?? ""}" placeholder="${state.quota}" title="Vide = quota par défaut">`
            : `${quotaOf(p)}${p.weekly_quota != null ? " (perso)" : ""}`}</td></tr>`).join("")
        || `<tr><td colspan="5" class="muted">Aucun animateur pour le moment.</td></tr>`}
    </table>
    ${g ? `<p class="muted small">Dans la colonne « Quota », laisse vide pour utiliser le quota par défaut (${state.quota}). Valide en appuyant sur Entrée ou en cliquant ailleurs.</p>` : ""}`;
}

// ---- Annonces : un texte prêt à copier pour chaque event à venir
function programText() {
  const [a, b] = weekRange(0);
  const evs = state.events.filter(e => e.status === "accepted" && !isDone(e)
    && new Date(e.event_date) >= a && new Date(e.event_date) < b).sort(byDate);
  if (!evs.length) return "";
  return ["📅 **Programme de la semaine**", ""]
    .concat(evs.map(e => `• ${cap(fmtDay(e.event_date))} à ${fmtTime(e.event_date)} : **${e.title}**`)).join("\n");
}

function viewAnnounces() {
  const list = state.events.filter(e => e.status === "accepted" && !isDone(e)).sort(byDate);
  const prog = programText();
  let html = `<h2>Annonces</h2>
    <p class="muted small">Une annonce est préparée pour chaque event à venir (titre, mot de passe, date, heure, description, récompense).
      Tu peux la modifier avant de la copier.</p>`;
  if (prog) html += `<div class="card"><h3>📅 Programme de la semaine</h3>
      <textarea class="ann" id="progText" rows="${prog.split("\n").length + 1}">${esc(prog)}</textarea>
      <div class="actions"><button class="btn primary" data-act="copyProg">📋 Copier le programme</button></div></div>`;
  html += list.length ? list.map(ev => {
    const miss = [];
    if (!state.passwords[ev.id]) miss.push("mot de passe");
    if (!ev.description) miss.push("description");
    if (!ev.reward) miss.push("récompense");
    return `<div class="card">
      <h3>${esc(ev.title)}</h3><div class="muted">📅 ${cap(fmtDay(ev.event_date))} à ${fmtTime(ev.event_date)}</div>
      ${miss.length ? `<p class="warn small">⚠️ Il manque : ${miss.join(", ")} (« à définir » dans l'annonce, à remplacer à la main ci-dessous).</p>` : ""}
      <textarea class="ann" data-ann="${ev.id}" rows="9">${esc(buildAnnouncement(ev))}</textarea>
      <div class="actions"><button class="btn primary" data-act="copyAnn" data-id="${ev.id}">📋 Copier l'annonce</button>
        <button class="btn ghost" data-act="resetAnn" data-id="${ev.id}">↺ Texte d'origine</button></div></div>`;
  }).join("") : empty("Aucun event à venir : pas d'annonce à préparer.");
  return html;
}

// ---- Profil : mes stats (ou celles d'un autre, en cliquant sur son nom dans Stats / Quotas)
function viewProfile() {
  const me = state.me, p = state.profiles[state.profileId] || me, own = p.id === me.id;
  const mine = state.events.filter(e => e.requested_by === p.id);
  const done = mine.filter(e => e.status === "accepted" && isDone(e)).sort(byDate);
  const next = mine.filter(e => e.status === "accepted" && !isDone(e)).sort(byDate)[0];
  const [wa, wb] = weekRange(0);
  const ma = new Date(); ma.setDate(1); ma.setHours(0, 0, 0, 0);
  const mb = new Date(ma); mb.setMonth(mb.getMonth() + 1);
  const inRange = (e, a, b) => new Date(e.event_date) >= a && new Date(e.event_date) < b;
  const last = done[done.length - 1];
  const daysAgo = last ? Math.floor((Date.now() - startMs(last)) / 864e5) : null;
  const short = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

  const tiles = [
    [done.length, "Events réalisés"],
    [done.filter(e => inRange(e, wa, wb)).length, "Cette semaine"],
    [done.filter(e => inRange(e, ma, mb)).length, "Ce mois-ci"],
    [last ? short(last.event_date) : "—", "Dernier event", last ? `${esc(last.title)} · ${daysAgo === 0 ? "aujourd'hui" : "il y a " + daysAgo + " jour(s)"}` : ""],
    [next ? short(next.event_date) : "—", "Prochain event", next ? esc(next.title) : ""],
    [state.events.filter(e => e.status === "accepted" && e.server_opener === p.id).length, "Serveurs ouverts"],
    [state.events.filter(e => e.status === "accepted" && isDone(e) && (e.staff_ids || []).includes(p.id)).length, "Présent en staff"],
  ];
  if (level(p) >= 3) tiles.push([state.events.filter(e => e.gear_by === p.id).length, "Gears fournis"]);
  if (isCounted(p) && quotaOf(p) > 0) tiles.push([`${streak(p)} sem.`, "Série (quota atteint)"]);
  if (own || isManager(me)) {
    const acc = mine.filter(e => e.status === "accepted").length, ref = mine.filter(e => e.status === "refused").length;
    tiles.push([acc + ref ? Math.round(100 * acc / (acc + ref)) + " %" : "—", "Demandes acceptées", `${acc} acceptée(s) · ${ref} refusée(s) · ${mine.filter(e => e.status === "pending").length} en attente`]);
  }
  tiles.push([p.created_at ? short(p.created_at) : "—", "Membre depuis"]);

  let quota = "";
  if (isCounted(p)) {
    const s = quotaStatus(p), pct = s.q ? Math.min(100, Math.round(100 * s.done / s.q)) : 100;
    quota = `<div class="card"><h3>Quota de la semaine</h3>
      <div>${s.done} fait(s) · ${s.total - s.done} prévu(s) · quota : <strong>${s.q}</strong> ${p.weekly_quota != null ? "(personnel)" : "(par défaut)"}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  const recent = done.slice(-5).reverse();
  return `${own ? "" : `<p><button class="btn ghost" data-act="openProfile" data-id="${me.id}">← Mon profil</button></p>`}
    <h2>👤 ${esc(p.username)}${adminBadge(p)} ${gradeChip(p.grade)}</h2>
    <div class="grid">${tiles.map(([v, l, sub]) => `<div class="stat"><b>${v}</b><span>${l}</span>${sub ? `<div class="muted small">${sub}</div>` : ""}</div>`).join("")}</div>
    ${quota}
    <h2>Derniers events</h2>
    ${recent.length ? recent.map(e => `<div class="card"><strong>${esc(e.title)}</strong> <span class="muted">· ${cap(fmtDay(e.event_date))}</span></div>`).join("") : empty("Aucun event réalisé pour le moment.")}`;
}

        <button class="btn ghost" data-act="logout">Déconnexion</button></div>
    </header>
    <nav>${tabs.map(t => `<button class="tab ${state.tab === t.id ? "on" : ""}" data-act="tab" data-id="${t.id}">${t.label}${counts[t.id] ? ` <span class="dot">${counts[t.id]}</span>` : ""}</button>`).join("")}</nav>
    ${quotaBanner()}
    <main>${VIEWS[state.tab]()}</main>`;
}


/* =====================================================================
   7. LES ACTIONS (boutons, formulaires)
   ===================================================================== */

// Envoie une modification à Supabase, affiche un message, puis recharge
async function mutate(promise, okMsg) {
  const { error } = await promise;
  if (error) toast(error.message, true);
  else if (okMsg) toast(okMsg);
  await refresh();
}

const actions = {
  // navigation
  tab:        async (id) => { state.tab = id; if (id === "profile") state.profileId = null; await refresh(); },
  openProfile: async (id) => { state.profileId = id === state.me.id ? null : id; state.tab = "profile"; await refresh(); },
  weekPrev:   () => { state.weekOffset--; render(); },
  weekNext:   () => { state.weekOffset++; render(); },
  weekToday:  () => { state.weekOffset = 0; render(); },
  histFilter: (id, el) => { state.histFilter = el.value; render(); },
  refresh:    () => refresh(),
  authMode:   (id) => { state.authMode = id; render(); },
  logout:     async () => { await db.auth.signOut(); Object.assign(state, { session: null, me: null, profiles: {}, events: [] }); render(); },

  // events : responsable / gérant
  accept: (id) => mutate(db.from("events").update({ status: "accepted", reviewed_by: state.me.id }).eq("id", id), "Event accepté ✅"),
  refuse: (id) => mutate(db.from("events").update({ status: "refused",  reviewed_by: state.me.id }).eq("id", id), "Demande refusée"),
  delete: (id) => confirm("Supprimer cet event ?") && mutate(db.from("events").delete().eq("id", id), "Event supprimé"),

  // serveur privé : animateur senior et plus (vérifié aussi côté Supabase)
  takeServer: (id) => mutate(db.rpc("take_server", { p_event: id, p_take: true }),  "Tu ouvres le serveur 🖥"),
  dropServer: (id) => mutate(db.rpc("take_server", { p_event: id, p_take: false }), "Serveur libéré"),

  // gears : responsable / gérant
  takeGears: (id) => mutate(db.rpc("take_gears", { p_event: id, p_take: true }),  "Tu fournis les gears ⚙️"),
  dropGears: (id) => mutate(db.rpc("take_gears", { p_event: id, p_take: false }), "Gears retirés"),

  // staff présent : choisir un membre dans la liste déroulante / le retirer
  addStaff: (_, el) => {
    const id = el.value;                       // le membre choisi dans la liste
    if (!id || !state.profiles[id]) return;
    if (document.querySelector(`#staffChips input[value="${id}"]`)) { el.value = ""; return; }   // déjà ajouté
    const p = state.profiles[id];
    const color = GRADES[p.grade] ? GRADES[p.grade].color : "#9aa0c0";
    document.getElementById("staffChips").insertAdjacentHTML("beforeend",
      `<span class="chip staffchip" style="--c:${color}">${esc(p.username)}
        <button type="button" class="x" data-act="removeStaff" data-id="${id}" title="Retirer">✕</button>
        <input type="hidden" name="staff" value="${id}"></span>`);
    el.querySelector(`option[value="${id}"]`).disabled = true;   // pas de doublon
    el.value = "";                                                // la liste revient sur "Ajouter…"
  },
  removeStaff: (id, el) => {
    el.closest(".staffchip")?.remove();
    const opt = document.querySelector(`select[data-act=addStaff] option[value="${id}"]`);
    if (opt) opt.disabled = false;
  },

  // annonces : copier / remettre le texte d'origine
  copyAnn:  (id) => copyText(document.querySelector(`textarea[data-ann="${id}"]`)?.value, "Annonce copiée 📋"),
  copyProg: () => copyText(document.getElementById("progText")?.value, "Programme copié 📋"),
  resetAnn: (id) => {
    const ev = state.events.find(e => e.id === id), t = document.querySelector(`textarea[data-ann="${id}"]`);
    if (ev && t) t.value = buildAnnouncement(ev);
  },

  // quotas : le gérant règle le quota par défaut et les quotas personnels
  saveGlobalQuota: () => {
    const v = Math.max(0, Math.min(14, parseInt(document.getElementById("globalQuota").value, 10) || 0));
    return mutate(db.from("app_settings").update({ weekly_quota: v }).eq("id", 1), "Quota par défaut enregistré");
  },
  setQuota: (id, el) => {
    const raw = el.value.trim();
    const v = raw === "" ? null : Math.max(0, Math.min(14, parseInt(raw, 10) || 0));
    return mutate(db.from("profiles").update({ weekly_quota: v }).eq("id", id), v === null ? "Quota remis par défaut" : "Quota modifié");
  },

  // mot de passe : copier dans le presse-papier
  copyPw:     (id) => copyText(state.passwords[id]),
  copyFormPw: () => copyText(document.querySelector("form[data-form=request] [name=password]")?.value.trim()),

  // équipe : gérant, et responsable (animateur / animateur senior seulement, vérifié aussi côté Supabase)
  setGrade:       (id, el) => mutate(db.rpc("set_member", { p_id: id, p_grade: el.value }), "Grade modifié"),
  setAdmin:       (id, el) => mutate(db.from("profiles").update({ is_admin: el.checked }).eq("id", id), "Badge modifié"),
  refuseMember:   (id) => confirm(`Refuser la demande de ${state.profiles[id]?.username || "ce membre"} ? Son compte sera supprimé (il pourra refaire une demande).`)
                          && mutate(db.rpc("refuse_member", { p_id: id }), "Demande refusée"),
  toggleApproved: (id) => mutate(db.rpc("set_member", { p_id: id, p_approved: !state.profiles[id].approved }), "Compte mis à jour"),
};

// Clic sur un bouton / lien avec data-act
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  e.preventDefault();
  actions[el.dataset.act]?.(el.dataset.id, el);
});

// Changement d'une liste déroulante / case à cocher avec data-act
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.tagName !== "SELECT" && el.tagName !== "INPUT")) return;
  actions[el.dataset.act]?.(el.dataset.id, el);
});

// Envoi d'un formulaire
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === "auth") submitAuth(form);
  if (form.dataset.form === "request") submitRequest(form);
});

// --- Connexion / inscription
function authError(msg) {
  if (/invalid login/i.test(msg)) return "Pseudo ou mot de passe incorrect.";
  if (/already registered/i.test(msg)) return "Ce pseudo est déjà pris.";
  if (/password/i.test(msg) && /6/.test(msg)) return "Mot de passe trop court (6 caractères minimum).";
  return msg;
}

async function submitAuth(form) {
  const f = new FormData(form);
  const username = String(f.get("username")).trim().toLowerCase();
  const password = String(f.get("password"));
  if (!/^[a-z0-9_.-]{3,20}$/.test(username))
    return toast("Pseudo : 3 à 20 caractères (lettres, chiffres, _ . -)", true);

  const email = `${username}@${EMAIL_DOMAIN}`;
  const res = state.authMode === "signup"
    ? await db.auth.signUp({ email, password })
    : await db.auth.signInWithPassword({ email, password });

  if (res.error) return toast(authError(res.error.message), true);
  if (!res.data.session)
    return toast("Compte créé, mais Supabase attend une confirmation par mail : désactive « Confirm email » dans Supabase.", true);

  state.session = res.data.session;
  await refresh();
}

// --- Demande d'event (ou création directe pour un responsable / gérant)
async function submitRequest(form) {
  const f = new FormData(form);
  const date = new Date(f.get("date"));
  if (isNaN(date) || date < new Date()) return toast("Choisis une date dans le futur.", true);

  const mgr = isManager(state.me);
  const password = String(f.get("password") || "").trim().slice(0, 8);
  const { data: created, error } = await db.from("events").insert({
    title: String(f.get("title")).trim(),
    description: String(f.get("description")).trim() || null,
    gear_note: String(f.get("gears")).trim() || null,
    reward: String(f.get("reward") || "").trim() || null,
    staff_ids: f.getAll("staff").map(String),
    staff_names: String(f.get("staff_names") || "").split(",").map(n => n.trim().slice(0, 30)).filter(Boolean).slice(0, 20),
    event_date: date.toISOString(),
    requested_by: state.me.id,
    status: mgr ? "accepted" : "pending",
    reviewed_by: mgr ? state.me.id : null,
  }).select("id").single();
  if (error) return toast(error.message, true);

  let pwFailed = false;
  if (password) {
    const r = await db.from("event_passwords").insert({ event_id: created.id, password });
    if (r.error) { pwFailed = true; toast("Event créé, mais le mot de passe n'a pas été enregistré : " + r.error.message, true); }
  }
  if (!pwFailed) toast(mgr ? "Event ajouté au planning ✅" : "Demande envoyée, un responsable va la valider ✅");
  if (mgr) state.tab = "planning";
  await refresh();
}


/* =====================================================================
   8. DÉMARRAGE
   ===================================================================== */

(async function start() {
  const app = document.getElementById("app");

  if (SUPABASE_URL.startsWith("COLLE")) {
    app.innerHTML = `<div class="auth card"><h1>Configuration requise</h1>
      <p>Ouvre <code>index.html</code> et remplace <code>SUPABASE_URL</code> et <code>SUPABASE_KEY</code> tout en haut du script (section 1).</p></div>`;
    return;
  }

  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await db.auth.getSession();
  state.session = data.session;
  if (state.session) await refresh(); else render();
})();
</script>
